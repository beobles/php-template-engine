<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .user-list {
            margin-top: 20px;
        }
        .user-item {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao Template Engine</h1>
        
        <!-- Exemplo com If -->
        <If condition="{{ user.logged }}">
            <div class="welcome">
                <h2>Olá, {{ user.name | uppercase }}!</h2>
                <p>Email: {{ user.email }}</p>
                <p>Role: {{ user.role }}</p>
            </div>
        <Else>
            <div class="login">
                <h2>Faça login para continuar</h2>
            </div>
        </Else>
        </If>
        
        <!-- Exemplo com Foreach -->
        <div class="user-list">
            <h3>Usuários do Sistema</h3>
            <Foreach items={{ users }} as="user,index">
                <div class="user-item">
                    <strong>#{{ index }}: {{ user.name }}</strong><br>
                    Email: {{ user.email }}
                </div>
            </Foreach>
        </div>
    </div>
</body>
</html>
